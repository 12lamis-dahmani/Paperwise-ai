[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperwise-ai"
version = "0.1.0"
description = "A local RAG assistant for research papers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "requests>=2.32.0",
    "streamlit>=1.38.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]